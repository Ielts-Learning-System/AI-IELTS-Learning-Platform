name: Speaking Service CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'ielts/be/speaking-service/**'
  workflow_dispatch:

jobs:
  speaking-service-ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ielts/be/speaking-service

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MONGO_URI: mongodb://localhost:27017/speaking_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
      MONGOMS_VERSION: '7.0.14'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ielts/be/speaking-service/package-lock.json

      - name: Cache mongodb-memory-server binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-memory-server/mongodb-binaries
          key: mongodb-binary-${{ runner.os }}-7.0.14

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speaking-service-coverage
          path: ielts/be/speaking-service/coverage/
          retention-days: 14
