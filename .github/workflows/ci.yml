name: CI — All Services

# This is the PRIMARY required check for branch protection.
# It runs ALL service test suites in parallel on every push to main
# and on every pull request targeting main — regardless of which files changed.
# All jobs must pass before a merge is allowed.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# ──────────────────────────────────────────────────────────────────────────────
# Reusable MongoDB health options (referenced per-job via YAML anchors — GitHub
# Actions does not support YAML anchors, so options are inlined per job).
# ──────────────────────────────────────────────────────────────────────────────

jobs:
  # ════════════════════════════════════════════════════════════════════════════
  # Node.js microservices — each runs on an isolated ubuntu-latest VM
  # ════════════════════════════════════════════════════════════════════════════

  auth-service:
    name: Auth Service (105 tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ielts/be/auth-service
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MONGO_URI: mongodb://localhost:27017/auth_test
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ielts/be/auth-service/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-service-coverage
          path: ielts/be/auth-service/coverage/
          retention-days: 14

