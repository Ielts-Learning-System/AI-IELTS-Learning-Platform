  # ════════════════════════════════════════════════════════════════════════════
  # Python AI Service — syntax check (no ML tests; PaddleOCR excluded from CI)
  # ════════════════════════════════════════════════════════════════════════════

  ai-service:
    name: AI Service (syntax check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ielts/be/ai-service
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight dependencies
        run: |
          pip install --upgrade pip
          grep -v -E "paddlepaddle|paddleocr|pdf2image|numpy" requirements.txt > requirements-ci.txt
          pip install --no-cache-dir -r requirements-ci.txt
      - name: Syntax check
        run: python -m py_compile main.py grading_utils.py

  # ════════════════════════════════════════════════════════════════════════════
  # Frontend — lint + build
  # ════════════════════════════════════════════════════════════════════════════

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ielts/fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ielts/fe/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ════════════════════════════════════════════════════════════════════════════
  # Required gate — all jobs above must succeed.
  # Add this job name to GitHub branch-protection "required status checks".
  # ════════════════════════════════════════════════════════════════════════════

  all-checks-pass:
    name: All checks passed
    runs-on: ubuntu-latest
    needs:
      - auth-service
      - billing-service
      - cloud-media-service
      - exam-service
      - lesson-service
      - listening-service
      - notification-service
      - payment-service
      - reading-service
      - speaking-service
      - writing-service
      - ai-service
      - frontend
    steps:
      - name: Report
        run: echo "All 850 Jest tests + AI syntax check + frontend build passed."
