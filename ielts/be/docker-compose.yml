services:
  # --- HẠ TẦNG ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ielts_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: ielts_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # --- MICROSERVICES ---
  api-gateway:
    build: ./api-gateway
    container_name: ielts_gateway
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Sử dụng tên service "auth-service" thay cho localhost/127.0.0.1
      - AUTH_SERVICE_URL=http://auth-service:3001
      - READING_SERVICE_URL=http://reading-service:3002
      - LISTENING_SERVICE_URL=http://listening-service:3003
      - WRITING_SERVICE_URL=http://writing-service:3004
      - SPEAKING_SERVICE_URL=http://speaking-service:3008
      - BILLING_SERVICE_URL=http://billing-service:3005
      - LESSON_SERVICE_URL=http://lesson-service:3007
      - MEDIA_SERVICE_URL=http://media-service:3010
      - PAYMENT_SERVICE_URL=http://payment-service:3009
      - NOTIFICATION_SERVICE_URL=http://notification-service:3011
      - AI_SERVICE_URL=http://ai-service:3012
      - EXAM_SERVICE_URL=http://exam-service:3013
    depends_on:
      - redis
      - auth-service
      - reading-service # Đảm bảo reading-service chạy trước api-gateway
      - listening-service # Đảm bảo listening-service chạy trước api-gateway
      - writing-service # Đảm bảo writing-service chạy trước api-gateway
      - speaking-service # Đảm bảo speaking-service chạy trước api-gateway
      - billing-service # Đảm bảo billing-service chạy trước api-gateway
      - lesson-service # Đảm bảo lesson-service chạy trước api-gateway
      - media-service # Đảm bảo media-service chạy trước api-gateway
      - payment-service # Đảm bảo payment-service chạy trước api-gateway
      - notification-service
      - ai-service
      - exam-service
    restart: unless-stopped

  auth-service:
    build: ./auth-service
    container_name: ielts_auth
    ports:
      - "3001:3001"
    env_file:
      - ./auth-service/.env
    restart: unless-stopped

  reading-service:
    build: ./reading-service
    container_name: ielts_reading
    ports:
      - "3002:3002"
    env_file:
      - ./reading-service/.env
    restart: unless-stopped

  listening-service:
    build: ./listening-service
    container_name: ielts_listening
    ports:
      - "3003:3003"
    env_file:
      - ./listening-service/.env
    restart: unless-stopped

  writing-service:
    build: ./writing-service
    container_name: ielts_writing
    ports:
      - "3004:3004"
    env_file:
      - ./writing-service/.env
    restart: unless-stopped

  speaking-service:
    build: ./speaking-service
    container_name: ielts_speaking
    ports:
      - "3008:3008"
    env_file:
      - ./speaking-service/.env
    restart: unless-stopped

  billing-service:
    build: ./billing-service
    container_name: ielts_billing
    ports:
      - "3005:3005"
    env_file:
      - ./billing-service/.env
    restart: unless-stopped

  lesson-service:
    build: ./lesson-service
    container_name: ielts_lesson
    ports:
      - "3007:3007"
    env_file:
      - ./lesson-service/.env
    restart: unless-stopped

  media-service:
    build: ./cloud-media-service
    container_name: ielts_media
    ports:
      - "3010:3010"
    env_file:
      - ./cloud-media-service/.env
    restart: unless-stopped

  payment-service:
    build: ./payment-service
    container_name: ielts_payment
    ports:
      - "3009:3009"
    env_file:
      - ./payment-service/.env
    restart: unless-stopped

  notification-service:
    build: ./notification-service
    container_name: ielts_notification
    ports:
      - "3011:3011"
    env_file:
      - ./notification-service/.env
    depends_on:
      - rabbitmq
    restart: unless-stopped

  # --- AI Service (FastAPI / Python) ---
  ai-service:
    build: ./ai-service
    container_name: ielts_ai
    ports:
      - "3012:3012"
    env_file:
      - ./ai-service/.env
    environment:
      - AUTH_SERVICE_INTERNAL_URL=http://auth-service:3001
    depends_on:
      - auth-service
    restart: unless-stopped

  exam-service:
    build: ./exam-service
    container_name: ielts_exam
    ports:
      - "3013:3013"
    env_file:
      - ./exam-service/.env
    depends_on:
      - rabbitmq
      - reading-service
      - listening-service
      - writing-service
      - speaking-service
      - ai-service
    restart: unless-stopped

  # --- SYNC DAEMON — bi-directional DB sync (service DBs ↔ ielts_backup_db) ---
  sync-daemon:
    build: ./sync-daemon
    container_name: ielts_sync_daemon
    env_file:
      - .env          # provides MONGO_URI_BACKUP + all MONGO_URI_* service vars
    restart: unless-stopped

  # (Tạm thời map 2 service Gateway và Auth trước để test. 
  # Khi nào code xong các service khác, ta sẽ copy block trên paste xuống và đổi tên)

volumes:
  rabbitmq_data:
  redis_data: