name: notification-service CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'be/notification-service/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'be/notification-service/**'

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be/notification-service

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      rabbitmq:
        image: rabbitmq:3-management
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd="rabbitmq-diagnostics -q check_running"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/ielts_notifications_test
      RABBITMQ_URL: amqp://guest:guest@localhost:5672
      JWT_SECRET: ci-test-jwt-secret
      EMAIL_PROVIDER: nodemailer
      SMTP_HOST: localhost
      SMTP_PORT: 587
      SMTP_USER: test@test.com
      SMTP_PASS: testpass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: be/notification-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: be/notification-service/coverage/

  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t notification-service:${{ github.sha }} ./be/notification-service
